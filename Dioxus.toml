[application]
name = "FlowFlow"

[bundle]
identifier = "com.mirkobozzetto.flowflow"
publisher = "Mirko Bozzetto"

[ios]
deployment_target = "16.0"
background_modes = ["audio"]

[ios.plist]
NSMicrophoneUsageDescription = "FlowFlow needs microphone access to record voice notes"
NSRemindersFullAccessUsageDescription = "FlowFlow creates reminders you confirm from your notes, so they alert you at the right time."
NSRemindersUsageDescription = "FlowFlow creates reminders you confirm from your notes, so they alert you at the right time."
NSCalendarsFullAccessUsageDescription = "FlowFlow adds calendar events for the time ranges you confirm from your notes."
NSCalendarsUsageDescription = "FlowFlow adds calendar events for the time ranges you confirm from your notes."
NSLocalNetworkUsageDescription = "FlowFlow connects directly to your other paired devices on your local network to sync your notes, without any server."
NSSupportsLiveActivities = true

# iOS 27 SDK requires the UIScene life cycle (TN3187). tao >= 0.35 provides
# TaoSceneDelegate and enables scene mode when this manifest is present.
[ios.plist.UIApplicationSceneManifest]
UIApplicationSupportsMultipleScenes = true

[[ios.plist.UIApplicationSceneManifest.UISceneConfigurations.UIWindowSceneSessionRoleApplication]]
UISceneConfigurationName = "Default Configuration"
UISceneDelegateClassName = "TaoSceneDelegate"

[[ios.widget_extensions]]
source = "src/ios/widget"
display_name = "FlowFlow Recording"
bundle_id_suffix = "recording-widget"
deployment_target = "16.2"
module_name = "RecordingPlugin"
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
ITSAppUsesNonExemptEncryption = false
LSRequiresIPhoneOS = true
MinimumOSVersion = "16.0"
CFBundleShortVersionString = "1.0.0"
CFBundleVersion = "1"
