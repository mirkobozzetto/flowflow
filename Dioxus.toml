[application]
name = "FlowFlow"

[bundle]
identifier = "com.mirkobozzetto.flowflow"
publisher = "Mirko Bozzetto"

[ios]
deployment_target = "16.0"
background_modes = ["audio"]

[ios.plist]
NSMicrophoneUsageDescription = "FlowFlow needs microphone access to record voice notes"
NSRemindersFullAccessUsageDescription = "FlowFlow creates reminders you confirm from your notes, so they alert you at the right time."
NSRemindersUsageDescription = "FlowFlow creates reminders you confirm from your notes, so they alert you at the right time."
NSSupportsLiveActivities = true

[[ios.widget_extensions]]
source = "src/ios/widget"
display_name = "FlowFlow Recording"
bundle_id_suffix = "recording-widget"
deployment_target = "16.2"
module_name = "RecordingPlugin"
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
ITSAppUsesNonExemptEncryption = false
LSRequiresIPhoneOS = true
MinimumOSVersion = "16.0"
CFBundleShortVersionString = "1.0.0"
CFBundleVersion = "1"
