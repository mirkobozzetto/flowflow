[application]
name = "FlowFlow"

[bundle]
identifier = "com.mirkobozzetto.flowflow"
publisher = "Mirko Bozzetto"

[ios.plist]
NSMicrophoneUsageDescription = "FlowFlow needs microphone access to record voice notes"
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
ITSAppUsesNonExemptEncryption = false
LSRequiresIPhoneOS = true
MinimumOSVersion = "16.0"
CFBundleShortVersionString = "1.0.0"
CFBundleVersion = "1"
