[package]
name = "flowflow"
version = "1.0.1"
edition = "2021"

[dependencies]
dioxus = { version = "0.7" }
cpal = "0.17"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "http2", "charset", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
dotenvy = "0.15"
rusqlite = { version = "0.34", features = ["bundled", "functions"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-timer = "3"
lancedb = { version = "0.27.2", default-features = false }
futures = { version = "0.3.32", default-features = false }
arrow-array = { version = "57", default-features = false }
arrow-schema = { version = "57", default-features = false }
pulldown-cmark = "0.12"
rig-core = { version = "0.36", default-features = false, features = ["rustls", "rmcp"] }
rmcp = { version = "1", default-features = false, features = ["client", "macros", "transport-streamable-http-client-reqwest"] }
pdf-extract = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
crc32fast = "1"
quick-xml = "0.36"
regex = "1"
fluent-bundle = "0.15"
fluent-langneg = "0.13"
unic-langid = "0.9"
snow = "0.10.0"
base64 = "0.22.1"
getrandom = "0.2"
ed25519-dalek = "2"
url = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.10"
whisper-rs = "0.16"
fs4 = "0.13"
libc = "0.2"
dom_smoothie = "0.18.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData", "NSDictionary", "NSValue"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-avf-audio = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSThread", "NSData", "NSDictionary", "NSValue", "NSNotification", "NSCalendar", "NSDate", "NSError", "NSTimeZone", "NSFileManager", "NSObjCRuntime", "NSPathUtilities", "block2"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIDocumentPickerViewController", "UIViewController", "UINavigationController", "UINavigationItem", "UIBarButtonItem", "UIBarItem", "UIWindow", "UIResponder", "UIActivityViewController", "UIActivity", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["EKEventStore", "EKReminder", "EKEvent", "EKCalendarItem", "EKObject", "EKCalendar", "EKAlarm", "EKRecurrenceRule", "EKRecurrenceEnd", "EKRecurrenceDayOfWeek", "EKTypes", "EKError", "block2"] }
objc2-event-kit-ui = { version = "0.3", default-features = false, features = ["std", "EKEventViewController", "objc2-event-kit", "objc2-ui-kit"] }

[features]
default = ["mobile"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
tempfile = "3.27.0"
