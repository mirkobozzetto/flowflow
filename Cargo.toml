[package]
name = "flowflow"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7" }
cpal = "0.17"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "http2", "charset"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-timer = "3"
lancedb = { version = "0.27.2", default-features = false }
futures = { version = "0.3.32", default-features = false }
arrow-array = { version = "57", default-features = false }
arrow-schema = { version = "57", default-features = false }
pulldown-cmark = "0.12"
rig-core = { version = "0.36", default-features = false, features = ["rustls"] }
pdf-extract = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
regex = "1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-avf-audio = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSThread", "NSData", "NSDictionary", "NSValue"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIDocumentPickerViewController", "UIViewController", "UIWindow", "UIResponder", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }

[features]
default = ["mobile"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
tempfile = "3.27.0"
