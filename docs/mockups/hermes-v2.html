<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes v2</title>
<link rel="stylesheet" href="kit/app.css">
<link rel="stylesheet" href="kit/phone.css">
<script src="kit/icons.js"></script>
<script src="kit/kit.js"></script>
<style>
  /* New in this proposal: the send button turns into Stop while Hermes answers. */
  .composer-primary .mk-stop { display: none; }
  .composer-primary.is-running { background: var(--color-stone-900); }
  .composer-primary.is-running .composer-icon { opacity: 0; }
  .composer-primary.is-running .mk-stop { display: flex; }
</style>
</head>
<body>

<div class="mk-bar">
  <button data-go="hermes">Chat Hermes</button>
  <button data-go="note">Une note</button>
  <button data-act="reset">Recommencer</button>
</div>

<div class="mk-phone bg-stone-100">
  <div class="mk-island"></div>
  <div class="mk-status bg-stone-100"><span>9:41</span><span>●●● ▮</span></div>

  <!-- Hermes chat -->
  <section class="mk-screen bg-stone-100" id="hermes">
    <div class="flex items-center px-4 py-3 bg-warm-white border-b border-stone-200 z-30 gap-3 min-h-[44px] shadow-card">
      <button class="glass-disc relative w-12 h-12 -my-0.5 shrink-0 flex items-center justify-center rounded-full text-stone-800">
        <svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="10" x2="19" y2="10"/><line x1="5" y1="18" x2="23" y2="18"/></svg>
      </button>
      <div class="relative flex-1 min-w-0 flex items-center gap-2">
        <img src="../../assets/hermes-agent.png" width="28" height="28" class="rounded-full object-cover">
        <div class="min-w-0 flex flex-col justify-center">
          <span class="text-lg font-semibold tracking-[-0.01em] text-stone-900 leading-tight truncate">Hermes</span>
          <button id="model-btn" data-act="model-menu" class="self-start inline-flex items-center gap-1 text-xs leading-tight text-ios-orange-dark active:opacity-70"><span id="model-label">Opus 5.5 · Moyenne</span><span class="inline-flex rotate-90"><i data-i="IconCaretRight" data-s="10"></i></span></button>
        </div>
      </div>
    </div>

    <div class="mk-scroll px-4 pt-4" id="thread">
      <div id="empty" class="flex flex-col items-center justify-center px-6 h-full">
        <img src="../../assets/hermes-agent.png" width="96" height="96" class="mb-6 rounded-full object-cover">
        <p class="text-stone-900 font-semibold text-base mb-1">Hermes</p>
        <p class="text-stone-400 text-sm text-center min-h-5">Opus 5.5 · <button data-act="skills-from-facts" class="underline decoration-stone-300 underline-offset-2">99 skills</button> · <button data-open="jobs-sheet" class="underline decoration-stone-300 underline-offset-2">6 tâches planifiées</button></p>
      </div>
      <div id="turns" class="space-y-3 pb-4"></div>
    </div>

    <div class="mk-dock">
      <div id="chips" class="flex flex-wrap items-center gap-1.5 px-2 pb-2 empty:hidden"></div>
      <div class="composer-stack relative flex-1 min-w-0">
        <div class="composer-capsule composer-glass relative h-[60px] rounded-[30px] border border-stone-300/80" data-plain="false">
          <div class="absolute left-[6px] bottom-[6px]">
            <button id="plus" data-act="plus" class="composer-plus pressable w-[46px] h-[46px] rounded-full flex items-center justify-center text-stone-600 hover:bg-stone-200/70"><i data-i="IconPlus" data-s="24"></i></button>
          </div>
          <textarea id="field" rows="1" placeholder="Demande à Hermes…" class="composer-field absolute top-2 left-1.5 right-1.5 max-h-40 bg-transparent border-0 px-1.5 py-[11px] text-[16px] leading-[1.4] outline-none text-stone-900 placeholder:text-stone-400 resize-none overflow-y-auto"></textarea>
          <button id="primary" data-act="primary" data-has-text="false" class="composer-primary pressable press-grow absolute right-[5px] bottom-[5px] w-[50px] h-[50px] rounded-full bg-ios-orange text-white flex items-center justify-center overflow-hidden">
            <span class="composer-icon composer-icon-mic absolute inset-0 flex items-center justify-center"><i data-i="IconMic" data-s="22"></i></span>
            <span class="composer-icon composer-icon-send absolute inset-0 flex items-center justify-center"><i data-i="IconArrowUp" data-s="22"></i></span>
            <span class="mk-stop absolute inset-0 items-center justify-center"><i data-i="IconStop" data-s="20"></i></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Scheduled jobs: the app's bottom sheet -->
    <div class="mk-layer" id="jobs-sheet">
      <div class="absolute inset-0 z-50 bg-black/35" data-close></div>
      <div class="absolute inset-x-0 bottom-0 z-50 bg-warm-white rounded-t-2xl shadow-menu flex flex-col max-h-[80%]">
        <div class="flex items-center justify-between px-4 py-3 border-b border-stone-100">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-stone-900 truncate">Tâches planifiées</p>
            <p class="text-xs text-stone-400" id="jobs-count"></p>
          </div>
          <button data-close class="w-11 h-11 flex items-center justify-center rounded-full active:bg-stone-100 text-stone-500 -mr-2"><i data-i="IconX" data-s="20"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto px-4 py-3 pb-10 space-y-2" id="jobs-list"></div>
      </div>
    </div>
  </section>

  <!-- Note -->
  <section class="mk-screen bg-stone-100" id="note">
    <div class="flex items-center px-4 py-3 bg-warm-white border-b border-stone-200 z-30 gap-3 min-h-[44px] shadow-card">
      <button class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-[10px] text-stone-700 hover:text-stone-900 hover:bg-stone-100 transition-colors duration-150"><i data-i="IconArrowLeft" data-s="22"></i></button>
      <button class="flex-1 min-w-0 text-left flex items-center gap-1.5 active:opacity-70">
        <span class="min-w-0 truncate text-lg font-semibold tracking-[-0.01em] text-stone-900">Lancement produit</span>
        <span class="text-stone-400"><i data-i="IconCaretRight" data-s="14"></i></span>
      </button>
      <button id="note-more" data-act="note-more" class="glass-disc relative w-11 h-11 shrink-0 flex items-center justify-center rounded-full text-stone-700"><i data-i="IconDotsThree" data-s="22"></i></button>
    </div>
    <div class="mk-scroll px-4 pt-3">
      <div class="pt-2 pb-3">
        <p class="w-full text-xl font-semibold py-1.5 text-stone-900">Retours des bêta-testeurs</p>
        <div class="mt-2 px-1">
          <p class="text-xs text-stone-500">Il y a 1 min</p>
          <p class="text-xs text-stone-400 mt-0.5">Créé le 25 sept., 10:12</p>
        </div>
      </div>
      <div class="border-t border-stone-200/70 pt-3 pb-2">
        <div class="flex flex-wrap items-center gap-1.5 mb-2">
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-warm-white border border-ios-orange/25 text-ios-orange-dark text-xs font-medium">retours <i data-i="IconX" data-s="12"></i></span>
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-warm-white border border-ios-orange/25 text-ios-orange-dark text-xs font-medium">bêta <i data-i="IconX" data-s="12"></i></span>
          <span class="w-24 text-xs border border-stone-200 rounded-full px-2.5 py-1 text-stone-400">+ tag</span>
        </div>
        <div class="w-full min-h-[300px] p-3 mt-3 rounded-xl border border-stone-300/60 bg-transparent text-sm prose prose-sm max-w-none text-stone-900">
          <p>Tout le monde adore la capture vocale. Deux personnes demandent un widget sur l'écran verrouillé. L'accueil est trop long : supprimer le troisième écran.</p>
        </div>
        <div class="flex justify-end gap-1 mt-1 ml-auto w-fit h-10 px-1 rounded-full bg-warm-white border border-stone-200 shadow-card">
          <button class="pressable flex items-center gap-1 min-h-[32px] px-2 rounded-full text-xs text-stone-400"><i data-i="IconPencil" data-s="14"></i>Éditer</button>
          <button data-act="toast" data-msg="Texte copié" class="pressable flex items-center gap-1 min-h-[32px] px-2 rounded-full text-xs text-stone-400"><i data-i="IconCopy" data-s="14"></i>Copier</button>
        </div>
      </div>
      <div class="h-32"></div>
    </div>
    <div class="mk-dock">
      <div class="composer-capsule composer-glass relative h-[60px] rounded-[30px] border border-stone-300/80">
        <div class="absolute left-[6px] bottom-[6px]">
          <button id="note-plus" data-act="note-plus" class="composer-plus pressable w-[46px] h-[46px] rounded-full flex items-center justify-center text-stone-600 hover:bg-stone-200/70"><i data-i="IconPlus" data-s="24"></i></button>
        </div>
        <textarea rows="1" placeholder="Ajouter à la note…" class="composer-field absolute top-2 left-1.5 right-1.5 max-h-40 bg-transparent border-0 px-1.5 py-[11px] text-[16px] leading-[1.4] outline-none text-stone-900 placeholder:text-stone-400 resize-none overflow-y-auto"></textarea>
        <button class="composer-primary pressable press-grow absolute right-[5px] bottom-[5px] w-[50px] h-[50px] rounded-full bg-ios-orange text-white flex items-center justify-center overflow-hidden" data-has-text="false">
          <span class="composer-icon composer-icon-mic absolute inset-0 flex items-center justify-center"><i data-i="IconMic" data-s="22"></i></span>
          <span class="composer-icon composer-icon-send absolute inset-0 flex items-center justify-center"><i data-i="IconArrowUp" data-s="22"></i></span>
        </button>
      </div>
    </div>
  </section>

  <div class="mk-toast"></div>
  <div class="mk-home"></div>
</div>

<script>
const { $, $$ } = Mock;
const FACE = "../../assets/hermes-agent.png";

const NOTES = [
  ["Retours des bêta-testeurs", "Il y a 1 min"],
  ["Plan de lancement de la version d'octobre", "25 sept., 10:12"],
  ["Bilan de la semaine", "25 sept., 10:12"],
  ["Appel comptable", "24 sept., 17:40"],
];
const SKILLS = [
  ["E-mail", "email-inbox-triage", "Trier la boîte de réception"],
  ["E-mail", "himalaya", "Lire et envoyer des e-mails"],
  ["GitHub", "github-code-review", "Relire une pull request"],
  ["GitHub", "github-auth", "Connecter un compte GitHub"],
  ["Business", "freelance-client-proposals", "Rédiger une proposition commerciale"],
  ["Business", "sales-prospecting", "Trouver des prospects"],
  ["Notes", "obsidian", "Lire et écrire dans Obsidian"],
  ["Apple", "apple-reminders", "Créer des rappels Apple"],
  ["Apple", "apple-notes", "Lire et écrire des notes Apple"],
  ["Agents", "claude-code", "Confier du code à Claude Code"],
  ["Agents", "codex", "Confier du code à Codex"],
  ["Création", "architecture-diagram", "Dessiner un schéma d'architecture"],
];
const PROMPTS = [
  ["Résumer", "Résume ce que je t'envoie en 5 points."],
  ["Proposition client", "Fais-moi une proposition en trois lots, avec un planning."],
  ["Script", "Écris le script qui sauvegarde mes notes chaque nuit."],
];
const JOBS = [
  ["Point quotidien global du matin", "Du lundi au vendredi, 5 h et 6 h", true],
  ["Trois posts LinkedIn par semaine", "Lundi, mercredi, vendredi à 5 h 30", true],
  ["Veille quotidienne missions et réseau", "Tous les jours à 7 h", false],
  ["Daily prospection et closing", "Du lundi au vendredi à 13 h", false],
  ["Préparation cold call du jeudi", "Mercredi à 13 h", false],
  ["Veille éditoriale tech quotidienne", "Tous les jours à 5 h", false],
];

let chips = [];
let running = null;
let model = "Opus 5.5", effort = "Moyenne";

// ---- composer --------------------------------------------------------------

function refreshPrimary() {
  const p = $("#primary");
  p.dataset.hasText = String(Boolean($("#field").value.trim() || chips.length));
  p.classList.toggle("is-running", Boolean(running));
}

const CHIP_ICON = { note: "IconNote", photo: "PhImage", file: "IconFileArrowUp", link: "IconLink", skill: "PhSparkle" };

function renderChips() {
  const box = $("#chips");
  box.innerHTML = "";
  chips.forEach((c, i) => {
    box.appendChild(Mock.html(`<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-warm-white border border-ios-orange/25 text-ios-orange-dark text-xs font-medium">
      <i data-i="${CHIP_ICON[c.kind]}" data-s="13"></i><span class="max-w-[170px] truncate">${c.label}</span>
      <button data-act="drop-chip" data-k="${i}" class="ml-0.5 text-ios-orange-dark"><i data-i="IconX" data-s="12"></i></button></span>`));
  });
  refreshPrimary();
}

function addChip(kind, label) {
  if (!chips.some((c) => c.kind === kind && c.label === label)) chips.push({ kind, label });
  renderChips();
}

// ---- native menus, as the app builds them -----------------------------------

function skillItems() {
  const out = [];
  let last = "";
  SKILLS.forEach(([cat, name, desc]) => {
    if (cat !== last) { out.push({ head: cat }); last = cat; }
    out.push({ icon: "PhSparkle", title: name, sub: desc, checked: chips.some((c) => c.label === name), run: () => addChip("skill", name) });
  });
  return out;
}

function hermesPlusItems() {
  return [
    { icon: "IconNote", title: "Une note", items: NOTES.map(([t, d]) => ({ icon: "IconNote", title: t, sub: d, run: () => addChip("note", t) })) },
    { icon: "PhImage", title: "Photos", run: () => addChip("photo", "Tableau blanc.jpg") },
    { icon: "PhCamera", title: "Appareil photo", run: () => addChip("photo", "Photo prise") },
    { icon: "IconFileArrowUp", title: "Fichier", sub: "PDF, Word, texte", run: () => addChip("file", "Cahier des charges.pdf") },
    { icon: "IconLink", title: "Lien", run: async () => {
      const url = await Mock.prompt($("#hermes"), "Joindre un lien", "Hermes lira la page.", "https://www.lesoir.be/economie", "Joindre");
      if (url) addChip("link", url.replace(/^https?:\/\//, ""));
    } },
    "sep",
    { icon: "PhChatText", title: "Modèles de prompts", items: PROMPTS.map(([t, text]) => ({ icon: "PhChatText", title: t, sub: text, run: () => { $("#field").value = text; refreshPrimary(); $("#field").focus(); } })) },
    { icon: "PhSparkle", title: "Skills", sub: "99 installés", items: skillItems() },
  ];
}

function modelItems() {
  const pick = (m) => () => { model = m; label(); };
  const level = (e) => () => { effort = e; label(); };
  const label = () => ($("#model-label").textContent = `${model} · ${effort}`);
  return [
    { head: "Claude" },
    ...["Opus 5.5", "Sonnet 5.5", "Haiku 4.5"].map((m) => ({ title: m, checked: model === m, run: pick(m) })),
    { title: "ChatGPT", items: [{ title: "GPT-5.4", checked: model === "GPT-5.4", run: pick("GPT-5.4") }] },
    "sep",
    { title: "Réflexion", sub: effort, items: ["Faible", "Moyenne", "Élevée", "Très élevée"].map((e) => ({ title: e, checked: effort === e, run: level(e) })) },
  ];
}

function noteToHermes() {
  Mock.go("hermes");
  addChip("note", "Retours des bêta-testeurs");
  $("#field").focus();
}

function notePlusItems() {
  return [
    { icon: "IconChatAi", title: "Ouvrir le chat", run: () => Mock.toast("Chat des notes, centré sur cette note") },
    { img: FACE, title: "Envoyer à Hermes", run: noteToHermes },
    { icon: "IconCardsThree", title: "Ajouter à un fil", items: [
      { icon: "IconCardsThree", title: "Lancement produit", sub: "4 notes", run: () => Mock.toast("Ajoutée au fil") },
      { icon: "IconPlus", title: "Nouveau fil", run: () => Mock.toast("Nouveau fil") },
    ] },
    "sep",
    { icon: "AgentsGlyph", title: "Agents", sub: "2 installés", items: [
      { icon: "AgentsGlyph", title: "Veille concurrence", run: () => Mock.toast("Agent lancé") },
      { icon: "AgentsGlyph", title: "Compte rendu client", run: () => Mock.toast("Agent lancé") },
    ] },
    { icon: "ConnectorsGlyph", title: "Connecteurs", sub: "Google Sheets connecté", items: [
      { icon: "ConnectorsGlyph", title: "Google Sheets", sub: "Connecté", run: () => {} },
    ] },
  ];
}

function noteMoreItems() {
  return [
    { icon: "PhDownloadSimple", title: "Importer un document", run: () => Mock.toast("Choisir un document") },
    { icon: "PhWaveform", title: "Importer un audio", run: () => Mock.toast("Choisir un audio") },
    { icon: "IconExport", title: "Partager", run: () => Mock.toast("Feuille de partage") },
    { img: FACE, title: "Envoyer à Hermes", run: noteToHermes },
    "sep",
    { icon: "IconTrash", title: "Supprimer la note", danger: true, run: () => Mock.toast("Supprimer cette note ?") },
  ];
}

// ---- scheduled jobs ----------------------------------------------------------

function renderJobs() {
  const box = $("#jobs-list");
  box.innerHTML = "";
  $("#jobs-count").textContent = `${JOBS.filter((j) => j[2]).length} actives sur ${JOBS.length}`;
  JOBS.forEach(([name, when, on], i) => {
    box.appendChild(Mock.html(`<div class="p-3 bg-warm-white border border-stone-200 rounded-xl">
      <div class="flex items-start gap-2 ${on ? "" : "opacity-60"}">
        <span class="mt-0.5 ${on ? "text-ios-orange-dark" : "text-stone-400"}"><i data-i="${on ? "PhClock" : "PhPause"}" data-s="18"></i></span>
        <div class="flex-1 min-w-0"><p class="text-sm font-semibold text-stone-800">${name}</p><p class="text-xs text-stone-500">${on ? "" : "En pause · "}${when}</p></div>
      </div>
      <div class="mt-3 flex gap-2">
        <button data-act="toggle-job" data-k="${i}" class="pressable flex-1 h-9 flex items-center justify-center rounded-lg bg-stone-100 text-stone-900 text-sm font-medium hover:bg-stone-200 active:bg-stone-300">${on ? "Mettre en pause" : "Reprendre"}</button>
        <button data-act="toast" data-msg="Lancée maintenant" class="pressable flex-1 h-9 flex items-center justify-center rounded-lg bg-ios-orange text-white text-sm font-medium hover:bg-ios-orange-dark">Lancer maintenant</button>
      </div></div>`));
  });
}

// ---- a Hermes turn -------------------------------------------------------------

function replyFor(q) {
  if (/script/i.test(q)) {
    return {
      think: "Une sauvegarde nocturne : un script shell, puis une tâche planifiée à 3 h.",
      steps: [["Écriture d'un fichier", "backup.sh"], ["Tâche planifiée", "tous les jours à 3 h"]],
      parts: [
        "<p>Voilà le script. Il tourne à 3 h et garde les 7 dernières copies.</p>",
        { code: '#!/bin/sh\ndest=~/backups/$(date +%F)\nmkdir -p "$dest"\ncp -R ~/notes "$dest"\nls -1d ~/backups/* | head -n -7 | xargs rm -rf' },
        "<p>Je l'ai aussi ajouté en tâche planifiée.</p>",
      ],
    };
  }
  return {
    think: "La note donne le budget et les deux interlocuteurs. Trois lots, le blog à part.",
    steps: [["Lecture de la note", "Retours des bêta-testeurs"], ["Skill", "freelance-client-proposals"], ["E-mail", "himalaya"]],
    parts: [
      "<p>Voici la proposition en trois lots :</p>",
      "<table><thead><tr><th>Lot</th><th>Contenu</th><th>Délai</th></tr></thead><tbody><tr><td>1</td><td>Accueil raccourci</td><td>1 sem.</td></tr><tr><td>2</td><td>Widget écran verrouillé</td><td>3 sem.</td></tr><tr><td>3</td><td>Tests et mise en ligne</td><td>1 sem.</td></tr></tbody></table>",
      { approval: { action: "Envoyer un e-mail", tool: "himalaya", fields: [["À", "directrice@client.be"], ["Objet", "Proposition en trois lots"]] } },
      "<p>Envoyé. Je te préviens quand elle répond.</p>",
    ],
  };
}

const fold = (label, body, extra = "") => Mock.html(`<div class="${extra}">
  <button data-act="fold" class="pressable w-full min-h-[40px] flex items-center justify-between">
    <span class="text-xs font-medium text-stone-500">${label}</span>
    <span class="fold-caret text-stone-400 transition-transform duration-180"><i data-i="IconCaretRight" data-s="14"></i></span></button>
  <div class="fold-body hidden">${body}</div></div>`);

const stepsBody = (steps) => `<div class="flex flex-col gap-1.5 mt-1">${steps.map(([t, d]) => `<div class="flex items-baseline gap-2 text-xs min-w-0"><span class="shrink-0 font-medium text-stone-700">${t}</span><span class="min-w-0 truncate text-stone-400">${d}</span></div>`).join("")}</div>`;

function approvalCard(a, decide) {
  const el = Mock.html(`<div class="mt-2 p-3 bg-warm-white border border-stone-200 rounded-xl">
    <div class="flex items-center gap-2 text-ios-orange-dark"><i data-i="IconShieldCheck" data-s="18"></i><span class="text-sm font-semibold text-stone-800">Validation requise</span></div>
    <div class="mt-0.5 text-xs text-stone-500">${a.action} · ${a.tool}</div>
    <div class="mt-2 space-y-1">${a.fields.map(([k, v]) => `<div class="flex gap-2 text-sm"><span class="shrink-0 text-stone-400">${k}</span><span class="text-stone-700 break-words">${v}</span></div>`).join("")}</div>
    <div class="a-row mt-3 flex gap-2">
      <button class="a-yes pressable flex-1 min-h-[44px] rounded-xl bg-ios-orange text-white font-medium text-sm hover:bg-ios-orange-dark active:scale-[0.98]">Autoriser</button>
      <button class="a-no pressable flex-1 min-h-[44px] rounded-xl bg-ios-red/10 text-ios-red font-medium text-sm hover:bg-ios-red/15 active:scale-[0.98]">Refuser</button>
    </div></div>`);
  const done = (ok) => {
    el.querySelector(".a-row").outerHTML = `<div class="mt-2 text-xs italic text-stone-400">${ok ? "Autorisé" : "Refusé"}</div>`;
    decide(ok);
  };
  el.querySelector(".a-yes").onclick = () => done(true);
  el.querySelector(".a-no").onclick = () => done(false);
  return el;
}

function scrollDown() { const t = $("#thread"); t.scrollTop = t.scrollHeight; }

function send() {
  const q = $("#field").value.trim();
  if (!q && !chips.length) return;
  $("#empty").classList.add("hidden");
  const sent = chips.slice();
  const extra = sent.length ? `<div class="flex justify-end mt-1"><span class="text-xs text-stone-400">${sent.map((c) => c.label).join(" · ")}</span></div>` : "";
  $("#turns").appendChild(Mock.html(`<div><div class="flex justify-end" style="animation: fadeInUp 0.15s ease-out;"><div class="bg-stone-900 text-white rounded-2xl rounded-br-md px-4 py-2.5 max-w-[80%] text-sm leading-relaxed break-words">${q || "…"}</div></div>${extra}</div>`));
  $("#field").value = "";
  chips = [];
  renderChips();

  const plan = replyFor(q + " " + sent.map((c) => c.label).join(" "));
  const reply = Mock.html(`<div class="flex justify-start items-start gap-2" style="animation: fadeInUp 0.15s ease-out;">
    <div class="mt-1 shrink-0"><img src="${FACE}" width="20" height="20" class="rounded-full object-cover"></div>
    <div class="min-w-0 max-w-[85%] py-1">
      <div class="r-think"></div>
      <div class="r-text text-sm text-stone-900 leading-relaxed break-words prose prose-sm"></div>
      <div class="r-dots flex items-center gap-1.5 h-6">${["0s", "0.12s", "0.24s"].map((d) => `<span class="w-1.5 h-1.5 rounded-full bg-stone-400" style="animation: typingDot 1.2s ease-in-out ${d} infinite;"></span>`).join("")}</div>
      <div class="r-steps"></div>
    </div></div>`);
  $("#turns").appendChild(reply);
  scrollDown();

  const text = reply.querySelector(".r-text");
  const dots = reply.querySelector(".r-dots");
  const queue = plan.parts.slice();
  let timer = null;

  const finish = (how) => {
    clearTimeout(timer);
    dots.remove();
    if (how === "stopped") text.appendChild(Mock.html(`<p class="text-xs italic text-stone-400">Réponse arrêtée.</p>`));
    if (how === "refused") text.appendChild(Mock.html(`<p>D'accord, je ne l'envoie pas. Le brouillon reste ici.</p>`));
    reply.querySelector(".r-steps").appendChild(fold(plan.steps.length === 1 ? "1 étape" : `${plan.steps.length} étapes`, stepsBody(plan.steps), "mt-2 pt-2 border-t border-stone-200/70"));
    running = null;
    refreshPrimary();
    scrollDown();
  };
  running = { stop: () => finish("stopped") };
  refreshPrimary();

  const type = (html, done) => {
    const holder = Mock.html(html);
    if (holder.tagName !== "P") { text.appendChild(holder); scrollDown(); timer = setTimeout(done, 300); return; }
    const words = holder.textContent.split(" ");
    const p = document.createElement("p");
    text.appendChild(p);
    let i = 0;
    const tick = () => {
      p.textContent = words.slice(0, ++i).join(" ");
      scrollDown();
      timer = setTimeout(i < words.length ? tick : done, 55);
    };
    tick();
  };

  const next = () => {
    const part = queue.shift();
    if (!part) return finish("done");
    if (typeof part === "string") return type(part, next);
    if (part.code) {
      const block = Mock.html(`<div class="relative"><pre><code></code></pre><button data-act="copy-code" class="absolute top-2 right-2 pressable flex items-center gap-1 min-h-[28px] px-2 rounded-full bg-warm-white border border-stone-200 text-xs text-stone-400"><i data-i="IconCopy" data-s="13"></i><span>Copier</span></button></div>`);
      block.querySelector("code").textContent = part.code;
      text.appendChild(block);
      scrollDown();
      timer = setTimeout(next, 400);
      return;
    }
    dots.classList.add("hidden");
    text.appendChild(approvalCard(part.approval, (ok) => {
      if (!ok) return finish("refused");
      dots.classList.remove("hidden");
      timer = setTimeout(next, 600);
    }));
    scrollDown();
  };

  timer = setTimeout(() => {
    reply.querySelector(".r-think").appendChild(fold("Réflexion · 8 s", `<p class="pb-2 text-xs text-stone-500 leading-relaxed">${plan.think}</p>`));
    timer = setTimeout(next, 400);
  }, 900);
}

// ---- wiring ---------------------------------------------------------------------

Object.assign(Mock.act, {
  plus(el) { Mock.menu(el, hermesPlusItems()); },
  "note-plus"(el) { Mock.menu(el, notePlusItems()); },
  "note-more"(el) { Mock.menu(el, noteMoreItems(), { above: false, right: true }); },
  "model-menu"(el) { Mock.menu(el, modelItems(), { above: false }); },
  "skills-from-facts"(el) { Mock.menu(el, skillItems()); },
  primary() {
    if (running) return running.stop();
    if ($("#field").value.trim() || chips.length) return send();
    Mock.toast("Dictée : parle, le texte arrive ici");
  },
  "drop-chip"(el) { chips.splice(+el.dataset.k, 1); renderChips(); },
  fold(el) {
    const box = el.parentElement;
    box.querySelector(".fold-body").classList.toggle("hidden");
    box.querySelector(".fold-caret").classList.toggle("rotate-90");
  },
  "copy-code"(el) {
    navigator.clipboard?.writeText(el.parentElement.querySelector("code").textContent);
    el.querySelector("span").textContent = "Copié";
    setTimeout(() => (el.querySelector("span").textContent = "Copier"), 1400);
  },
  "toggle-job"(el) { const j = JOBS[+el.dataset.k]; j[2] = !j[2]; renderJobs(); },
  toast(el) { Mock.toast(el.dataset.msg); },
  reset() { location.reload(); },
});

$("#field").addEventListener("input", refreshPrimary);
$("#field").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); Mock.act.primary(); }
});

renderJobs();
Mock.start("hermes");
refreshPrimary();
</script>
</body>
</html>
